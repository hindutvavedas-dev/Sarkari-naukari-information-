name: Build ExamMate APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - - name: Setup Android SDK
  uses: android-actions/setup-android@v4
  with:
    accept-android-sdk-licenses: true

      - name: Build APK
        working-directory: ExamMateAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamMate-debug-apk
          path: ExamMateAndroid/app/build/outputs/apk/debug/app-debug.apk
